<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#080b16">

  <title>Dabrna Royale 👑</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app game-page">

  <!-- HEADER -->
  <header class="game-header">

    <button class="back-btn" id="backButton">
      →
    </button>

    <div class="game-title">
      <h2>👑 Dabrna Royale</h2>
      <span id="modeLabel">در حال آماده‌سازی...</span>
    </div>

    <div class="coins">
      🪙 <span id="gameCoins">0</span>
    </div>

  </header>


  <!-- PLAYERS -->
  <section class="panel players-panel">

    <div class="player-grid" id="playersGrid">
      <!-- Players ساخته می‌شوند -->
    </div>

  </section>


  <!-- MAIN GAME -->
  <main class="game-board">

    <!-- NUMBER -->
    <section class="draw-card panel">

      <div class="draw-title">
        <span>🎲</span>
        <b>شماره بازی</b>
      </div>

      <div class="draw-number" id="drawNumber">
        ?
      </div>

      <div class="draw-status" id="drawStatus">
        برای شروع دکمه را بزن
      </div>

      <button class="draw-button" id="drawButton">
        🎲 انتخاب شماره
      </button>

    </section>


    <!-- CARD -->
    <section class="dabrna-card panel">

      <div class="card-header">

        <div>
          <span>🃏</span>
          <b>کارت دبرنا</b>
        </div>

        <div class="card-theme" id="cardThemeName">
          Classic
        </div>

      </div>


      <div class="number-grid" id="numberGrid">

        <!--
          1 تا 90
          توسط JavaScript ساخته می‌شود
        -->

      </div>

    </section>


    <!-- ACTIONS -->
    <section class="game-actions">

      <button class="action-button hint" id="hintButton">
        💡 راهنما
        <span>25 🪙</span>
      </button>

      <button class="action-button bingo" id="bingoButton">
        🏆 دبرنا!
      </button>

    </section>


    <!-- MESSAGE -->
    <section class="game-message panel" id="gameMessage">
      <span>🎯</span>
      <p>منتظر شماره بعدی باش...</p>
    </section>

  </main>


  <!-- WIN MODAL -->
  <div class="modal-overlay" id="winModal">

    <div class="win-modal">

      <div class="win-trophy">
        🏆
      </div>

      <h2>تبریک! 🎉</h2>

      <p id="winText">
        تو برنده شدی!
      </p>

      <div class="reward-box">

        <div>
          <span>⭐</span>
          <b id="rewardXp">+0 XP</b>
        </div>

        <div>
          <span>🪙</span>
          <b id="rewardCoins">+0</b>
        </div>

        <div>
          <span>🏆</span>
          <b id="rewardTrophy">+1</b>
        </div>

      </div>

      <button class="primary-button" id="nextGameButton">
        🎮 بازی بعدی
      </button>

      <button class="secondary-button" id="homeButton">
        🏠 صفحه اصلی
      </button>

    </div>

  </div>


  <!-- START MODAL -->
  <div class="modal-overlay show" id="startModal">

    <div class="start-modal">

      <div class="start-icon">
        👑
      </div>

      <h2>آماده‌ای؟</h2>

      <p id="startDescription">
        بازی در حال آماده‌سازی است...
      </p>

      <div class="difficulty-box">

        <span>🤖</span>

        <div>
          <b>سطح حریف‌ها</b>
          <small id="botDifficulty">
            معمولی
          </small>
        </div>

      </div>

      <button class="primary-button" id="startGameButton">
        🚀 شروع بازی
      </button>

    </div>

  </div>

</div>


<script src="game.js"></script>

</body>
</html>
