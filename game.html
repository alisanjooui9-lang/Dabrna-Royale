<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dabrna Royale</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="game-page">

<div class="game-app">

  <!-- Header -->
  <header class="game-header">
    <button class="back-btn" onclick="goHome()">←</button>

    <div class="game-title">
      <span>👑</span>
      <div>
        <strong>دبرنا رویال</strong>
        <small id="modeLabel">بازی</small>
      </div>
    </div>

    <div class="game-coins">
      🪙 <span id="gameCoins">0</span>
    </div>
  </header>


  <!-- بازیکنان -->
  <section class="players-panel">
    <div class="section-title">
      <span>👥 بازیکنان</span>
    </div>

    <div id="playersGrid" class="players-grid"></div>
  </section>


  <!-- قسمت اصلی بازی -->
  <main class="royale-board">

    <!-- کیسه مهره -->
    <section class="draw-area">

      <div class="bag-container">

        <div class="bag-glow"></div>

        <div id="bag" class="number-bag">
          <div class="bag-rope"></div>

          <div class="bag-face">
            <span>🎲</span>
          </div>

          <div class="bag-logo">
            DABRNA
          </div>
        </div>

        <div id="drawBall" class="draw-ball">
          <span id="drawNumber">—</span>
        </div>

      </div>

      <div class="draw-info">
        <strong id="drawStatus">در حال آماده‌سازی...</strong>
        <small id="nextDrawTimer">مهره بعدی: ۱۰ ثانیه</small>
      </div>

    </section>


    <!-- کارت بازیکن -->
    <section class="my-card-section">

      <div class="card-heading">
        <div>
          <span class="card-crown">👑</span>
          <strong>کارت دبرنای شما</strong>
        </div>

        <span id="cardThemeName" class="theme-label">
          کلاسیک
        </span>
      </div>

      <div id="playerCard" class="dabrna-card"></div>

      <div class="card-help">
        🎯 با آمدن هر شماره، خانه مربوط به آن مشخص می‌شود.
      </div>

    </section>


    <!-- کارت بازیکنان دیگر -->
    <section class="other-players-section">

      <div class="section-title">
        <span>🎮 کارت بازیکنان</span>
      </div>

      <div id="otherPlayersCards" class="other-cards"></div>

    </section>


    <!-- دکمه‌های پایین -->
    <section class="game-actions">

      <button id="hintButton" class="game-action hint-action">
        💡 راهنما
        <small>۲۵ 🪙</small>
      </button>

      <button id="bingoButton" class="game-action bingo-action">
        🏆 دبرنا!
      </button>

    </section>


    <!-- پیام بازی -->
    <div id="gameMessage" class="game-message"></div>

  </main>


  <!-- مودال شروع -->
  <div id="startModal" class="modal-overlay">

    <div class="modal-card start-card">

      <div class="modal-icon">👑</div>

      <h2>دبرنا رویال</h2>

      <p>
        آماده‌ای وارد بازی بشی؟
      </p>

      <div class="difficulty-box">
        <span>سطح بازی</span>
        <strong id="difficultyName">معمولی</strong>
      </div>

      <button id="startGameButton" class="primary-btn">
        🎮 شروع بازی
      </button>

    </div>

  </div>


  <!-- مودال برد -->
  <div id="winModal" class="modal-overlay hidden">

    <div class="modal-card win-card">

      <div class="win-icon">🏆</div>

      <h2 id="winnerTitle">دبرنا!</h2>

      <p id="winnerText">
        شما برنده شدید!
      </p>

      <div class="reward-box">

        <div>
          <span>XP</span>
          <strong id="rewardXP">+0</strong>
        </div>

        <div>
          <span>سکه</span>
          <strong id="rewardCoins">+0 🪙</strong>
        </div>

        <div>
          <span>جام</span>
          <strong id="rewardTrophy">+0 🏆</strong>
        </div>

      </div>

      <div class="modal-buttons">

        <button id="nextGameButton" class="primary-btn">
          🎮 بازی بعدی
        </button>

        <button onclick="goHome()" class="secondary-btn">
          🏠 صفحه اصلی
        </button>

      </div>

    </div>

  </div>

</div>

<script src="game.js"></script>

</body>
</html>
